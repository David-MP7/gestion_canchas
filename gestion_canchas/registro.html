<!-- Formulario -->
    <div class="container register-container">

        <div class="card">

            <div class="card-header">
                Crear Cuenta
            </div>

            <div class="card-body">

                <form id="formRegistro">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingresa tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Ingresa tu apellido" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ingresa tu teléfono" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Ingresa tu correo" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="Crea una contraseña" required>
                    </div>

                    <button type="button" class="btn btn-danger w-100" onclick="guardar_usuario()">
                           Registrarse
                        </button>

                </form>

                <hr>

                <div class="text-center">

                    <p>¿Ya tienes una cuenta?</p>

                    <a href="login.html" class="btn btn-outline-danger w-100">
                        Iniciar Sesión
                    </a>

                </div>

            </div>

        </div>
